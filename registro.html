<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - MarketSys</title>
</head>
<body>

    <header>
        <h1>Sistema de Gestión - Supermercado</h1>
        <h2>Registro de Usuario</h2>
    </header>

    <main>
        <!-- Formulario que te redirige al login tras registrarte -->
        <form action="login.html" method="GET">
            
            <div>
                <label for="tipo_usuario">Registrarse como:</label>
                <select id="tipo_usuario" name="tipo_usuario" required>
                    <option value="administrador">Administrador</option>
                    <option value="empleado">Empleado</option>
                    <option value="proveedor">Proveedor</option>
                    <option value="cliente">Cliente</option>
                </select>
            </div>

            <div>
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>

            <div>
                <label for="apellido">Apellido (o Razón Social si es proveedor):</label>
                <input type="text" id="apellido" name="apellido" required>
            </div>

            <div>
                <label for="documento">Documento / CUIT:</label>
                <input type="text" id="documento" name="documento">
            </div>

            <div>
                <label for="telefono">Teléfono:</label>
                <input type="text" id="telefono" name="telefono">
            </div>

            <div>
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" name="email" required placeholder="correo@ejemplo.com">
            </div>

            <div>
                <label for="direccion">Dirección:</label>
                <input type="text" id="direccion" name="direccion">
            </div>

            <div>
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required placeholder="********">
            </div>

            <button type="submit">Registrarse y Continuar</button>

        </form>

        <p>¿Ya tenés una cuenta? <a href="login.html">Iniciar Sesión</a></p>
    </main>

    <footer>
        <p>&copy; 2026 - Sistema MarketSys</p>
    </footer>

</body>
</html>
