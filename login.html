<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - MarketSys</title>
    <script>
        // Función para redirigir según el rol seleccionado al hacer clic en Ingresar
        function redirigirLogin(event) {
            event.preventDefault(); // Evita que recargue la página por defecto
            const rol = document.getElementById('rol').value;

            if (rol === 'administrador') {
                window.location.href = 'admin/index.html';
            } else if (rol === 'empleado') {
                window.location.href = 'empleados/index.html';
            } else if (rol === 'cliente') {
                window.location.href = 'clientes/index.html';
            }
        }
    </script>
</head>
<body>

    <header>
        <h1>Sistema de Gestión - Supermercado</h1>
        <h2>Iniciar Sesión</h2>
    </header>

    <main>
        <form onsubmit="redirigirLogin(event)">
            <div>
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" name="email" required placeholder="correo@ejemplo.com">
            </div>
            <div>
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required placeholder="********">
            </div>
            <div>
                <label for="rol">Tipo de Usuario:</label>
                <select id="rol" name="rol">
                    <option value="administrador">Administrador</option>
                    <option value="empleado">Empleado</option>
                    <option value="cliente">Cliente</option>
                </select>
            </div>
            <button type="submit">Ingresar</button>
        </form>
        
        <p>¿No tenés cuenta? <a href="registro.html">Registrarse</a></p>
    </main>

    <footer>
        <p>&copy; 2026 - Sistema MarketSys</p>
    </footer>

</body>
</html>
